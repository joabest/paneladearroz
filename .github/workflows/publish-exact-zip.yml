name: Publicar ZIP original exato

on:
  push:
    paths:
      - '.github/workflows/publish-exact-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir e validar pacote original
        shell: bash
        run: |
          set -euo pipefail
          cat .site/p00.b64 .site/p01.b64 .site/p02.b64 .site/p03.b64 .site/p04.b64 .site/p05.b64 | base64 -d > /tmp/site.tar.xz
          echo '95877fc0100b57fde129342153d902214ba2308eda34efffe84dba061b873ff2  /tmp/site.tar.xz' | sha256sum -c -
          rm -rf /tmp/site
          mkdir -p /tmp/site
          tar -xJf /tmp/site.tar.xz -C /tmp/site
          test -f /tmp/site/index.html
          COUNT=$(find /tmp/site -type f | wc -l | tr -d ' ')
          echo "Arquivos extraídos: $COUNT"
          test "$COUNT" = '88'

      - name: Substituir repositório pelo conteúdo exato
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .
          cp -a /tmp/site/. .
          git add -A
          COUNT=$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')
          echo "Arquivos finais: $COUNT"
          test "$COUNT" = '88'

      - name: Commitar e publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publicar conteúdo exato do ZIP original'
          git push origin HEAD:test
