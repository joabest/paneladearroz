name: Importar pacote aprovado

on:
  push:
    paths:
      - '.github/workflows/importar-pacote-aprovado.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar pacote aprovado
        run: |
          set -e
          curl -fL --retry 3 --connect-timeout 20 \
            'https://drive.usercontent.google.com/download?id=128Sy9hn78qY0neYYnZlIQO8drvD7PBa4&export=download&confirm=t' \
            -o /tmp/site.zip
          echo "Tamanho baixado: $(stat -c%s /tmp/site.zip) bytes"
          unzip -t /tmp/site.zip >/dev/null

      - name: Substituir versão antiga
        run: |
          set -e
          rm -f index.html README.md
          rm -rf assets images fonts js
          unzip -q /tmp/site.zip -d .
          test -s index.html
          test -d images
          test -d fonts
          grep -qi 'Panela de Arroz' index.html
          echo "Arquivos finais: $(find . -type f -not -path './.git/*' | wc -l)"

      - name: Commitar site
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/importar-site-original.yml
          rm -f .github/workflows/importar-pacote-aprovado.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'Subir site de panela baseado no ZIP original'
          git push
